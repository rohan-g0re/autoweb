[project]
name = "autoweb"
version = "0.1.0"
description = "A stub for web automation. Not a framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AutoWeb contributors" }]
keywords = ["browser-automation", "playwright", "mcp", "agents", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  # Browser control. Needed for the one operation MCP cannot do:
  # storageState({indexedDB: True}). See docs/STORAGE-EXPORT.md.
  "playwright>=1.51",
  # TOML writing (reading uses stdlib tomllib on 3.11+).
  "tomli-w>=1.0",
  "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
# Only needed once lanes move out of Claude Code and into their own processes.
sdk = ["claude-agent-sdk>=0.2", "mcp>=1.6.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
autoweb = "autoweb.cli:main"

[project.urls]
Homepage = "https://github.com/rohan-g0re/autoweb"
Documentation = "https://github.com/rohan-g0re/autoweb/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoweb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
